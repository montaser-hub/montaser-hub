    .tile { animation: tile-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .roll { animation-duration: 1.6s; animation-timing-function: cubic-bezier(0.22, 1, 0.36, 1); animation-fill-mode: both; }

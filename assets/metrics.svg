<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="1,205 automated tests written, 304 API endpoints shipped, 4 platforms built with teams, 2+ years in production code">
  <style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 424" width="590" height="424" role="img" aria-label="Projects per area: Frontend 12 of 18, Backend &amp; APIs 8 of 18, Databases 9 of 18, Real-time &amp; queues 2 of 18, Testing 7 of 18, Containers &amp; tooling 6 of 18">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }

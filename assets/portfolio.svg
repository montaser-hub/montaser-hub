<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 190" width="1200" height="190" role="img" aria-label="See the work in detail. 4 case studies, 8 projects, 5 live demos. montaser-hub.github.io">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .in { animation: in 0.7s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .rule { transform-box: fill-box; transform-origin: left; animation: rule 0.9s cubic-bezier(0.22, 1, 0.36, 1) 0.2s backwards; }
    .go { animation: go 1.8s ease-in-out infinite; }
    @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes rule { from { transform: scaleX(0); } }
    @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(8px); } }
    @media (prefers-reduced-motion: reduce) { .in, .rule, .go { animation: none; } }
  </style>
  <text class="mono accent in" x="4" y="34" font-size="14" letter-spacing="2.5">PORTFOLIO</text>
  <text class="fg in" style="animation-delay: 0.08s" x="2" y="92" font-size="46" font-weight="800" letter-spacing="-1">See the work in detail</text>
  <text class="muted in" style="animation-delay: 0.16s" x="4" y="130" font-size="18">4 case studies   ·   8 projects   ·   5 live demos</text>

  <g class="in" style="animation-delay: 0.24s">
    <text class="accent" x="1140" y="92" text-anchor="end" font-size="24" font-weight="700">montaser-hub.github.io</text>
    <rect class="accent rule" x="850" y="104" width="290" height="2" rx="1"/>
    <path class="go accent-line" d="M1156 84h26m-9-9 9 9-9 9" fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <line class="edge" x1="0" y1="174" x2="1200" y2="174"/>
</svg>

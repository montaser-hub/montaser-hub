<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="See the work in detail. 4 case studies, 8 projects, 5 live demos. montaser-hub.github.io">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .box { fill: var(--box); }
    svg { --box: rgba(76, 141, 255, 0.12); }
    @media (prefers-color-scheme: light) { svg { --box: rgba(9, 105, 218, 0.09); } }
    .carousel { animation: carousel 8.8s cubic-bezier(0.22, 1, 0.36, 1) infinite; }
    .go { animation: go 1.8s ease-in-out infinite; }
    @keyframes carousel {
      0.00%, 19.50% { transform: translateY(-0px); }
      25.00%, 44.50% { transform: translateY(-62px); }
      50.00%, 69.50% { transform: translateY(-124px); }
      75.00%, 94.50% { transform: translateY(-186px); }
      100% { transform: translateY(-248px); }
    }
    @keyframes go { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(6px); } }
    @media (prefers-reduced-motion: reduce) { .carousel, .go { animation: none; } }
  </style>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Montaser Ismail on GitHub: 2,364 contributions in the last year, 19 public repositories, joined 6 years ago">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .row { animation: row-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    @keyframes row-in { from { opacity: 0; transform: translateX(-8px); } }
    .line { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards; }
    .area { animation: fade 1.2s ease-out 0.9s backwards; }
    .peak { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-out 2s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes fade { from { opacity: 0; } }
    @keyframes pulse { 0% { transform: scale(1); opacity: 0.8; } 70%, 100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .line { animation: none; stroke-dashoffset: 0; } .area, .peak { animation: none; } }
    @media (prefers-reduced-motion: reduce) { .row { animation: none; } }
  </style>

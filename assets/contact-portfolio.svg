<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 68" width="290" height="68" role="img" aria-label="Portfolio: montaser-hub.github.io">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .card { animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.00s backwards; }
    .arrow { animation: nudge 2.4s ease-in-out 0.0s infinite; }
    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translate(0, 0); } 85% { transform: translate(3px, -3px); } }
    @media (prefers-reduced-motion: reduce) { .card, .arrow { animation: none; } }
  </style>
  <g class="card">
    <g transform="translate(6 18) scale(1.25)"><path class="accent-line" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="fg" x="50" y="31" font-size="17" font-weight="700">Portfolio</text>
    <path class="arrow accent-line" d="M157.39999999999998 30l8-8m-6.5 0h6.5v6.5" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="dim" x="50" y="52" font-size="13">montaser-hub.github.io</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 290 88" width="290" height="88" role="img" aria-label="Portfolio: montaser-hub.github.io">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .card { animation: card-in 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.00s backwards; }
    .arrow { animation: nudge 2.4s ease-in-out 0.0s infinite; }
    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes nudge { 0%, 70%, 100% { transform: translate(0, 0); } 85% { transform: translate(3px, -3px); } }
    @media (prefers-reduced-motion: reduce) { .card, .arrow { animation: none; } }
  </style>
  <g class="card">
    <rect class="panel edge" x="0.5" y="0.5" width="289" height="87" rx="16" stroke-width="1"/>
    <rect class="accent" x="18" y="20" width="48" height="48" rx="13" opacity="0.14"/>
    <g transform="translate(30 32)"><path class="accent-line" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18ZM3 12h18M12 3c2.6 2.6 3.9 5.6 3.9 9s-1.3 6.4-3.9 9c-2.6-2.6-3.9-5.6-3.9-9S9.4 5.6 12 3Z" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text class="fg" x="80" y="40" font-size="16.5" font-weight="700">Portfolio</text>
    <text class="dim" x="80" y="60" font-size="12.5">montaser-hub.github.io</text>
    <path class="arrow dim-line" d="M256 49l10-10m-8 0h8v8" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Montaser Ismail, Software Engineer · Egypt. I build software for how businesses actually run.">
  <style>
    .bg { fill: #0d1117; } .panel { fill: #151b23; } .edge { stroke: #2a313c; }
    .fg { fill: #e6edf3; } .muted { fill: #9da7b3; } .dim { fill: #7d8590; }
    .accent { fill: #4c8dff; } .accent-line { stroke: #4c8dff; } .dim-line { stroke: #7d8590; }
    .stop-accent { stop-color: #4c8dff; } .stop-fg { stop-color: #e6edf3; }
    @media (prefers-color-scheme: light) {
    .bg { fill: #ffffff; } .panel { fill: #f6f8fa; } .edge { stroke: #d0d7de; }
    .fg { fill: #1f2328; } .muted { fill: #59636e; } .dim { fill: #6e7781; }
    .accent { fill: #0969da; } .accent-line { stroke: #0969da; } .dim-line { stroke: #6e7781; }
    .stop-accent { stop-color: #0969da; } .stop-fg { stop-color: #1f2328; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    
    .typed { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
    .rise { animation: rise 0.8s cubic-bezier(0.22, 1, 0.36, 1) backwards; }
    .beat { transform-box: fill-box; transform-origin: center; animation: beat 2.4s ease-out infinite; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes beat { 0% { transform: scale(1); opacity: 0.7; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
    
    @keyframes reveal-0 {
      0%, 0.000% { transform: scaleX(0); animation-timing-function: steps(41, end); }
      10.250%, 19.000% { transform: scaleX(1); animation-timing-function: steps(41, end); }
      23.000%, 100% { transform: scaleX(0); } }
    @keyframes caret-0 {
      0%, 0.000% { transform: translateX(0); animation-timing-function: steps(41, end); }
      10.250%, 19.000% { transform: translateX(516.6px); animation-timing-function: steps(41, end); }
      23.000%, 100% { transform: translateX(0); } }
    @keyframes show-0 { 0%, 0.000% { opacity: 0; } 0.050%, 23.000% { opacity: 1; } 23.050%, 100% { opacity: 0; } }
    .clip-0 { transform-box: fill-box; transform-origin: left; animation: reveal-0 20s infinite; }
    .caret-0 { animation: caret-0 20s infinite, show-0 20s infinite; }
    @keyframes reveal-1 {
      0%, 25.000% { transform: scaleX(0); animation-timing-function: steps(33, end); }
      33.250%, 44.000% { transform: scaleX(1); animation-timing-function: steps(33, end); }
      48.000%, 100% { transform: scaleX(0); } }
    @keyframes caret-1 {
      0%, 25.000% { transform: translateX(0); animation-timing-function: steps(33, end); }
      33.250%, 44.000% { transform: translateX(415.8px); animation-timing-function: steps(33, end); }
      48.000%, 100% { transform: translateX(0); } }
    @keyframes show-1 { 0%, 25.000% { opacity: 0; } 25.050%, 48.000% { opacity: 1; } 48.050%, 100% { opacity: 0; } }
    .clip-1 { transform-box: fill-box; transform-origin: left; animation: reveal-1 20s infinite; }
    .caret-1 { animation: caret-1 20s infinite, show-1 20s infinite; }
    @keyframes reveal-2 {
      0%, 50.000% { transform: scaleX(0); animation-timing-function: steps(34, end); }
      58.500%, 69.000% { transform: scaleX(1); animation-timing-function: steps(34, end); }
      73.000%, 100% { transform: scaleX(0); } }
    @keyframes caret-2 {
      0%, 50.000% { transform: translateX(0); animation-timing-function: steps(34, end); }
      58.500%, 69.000% { transform: translateX(428.4px); animation-timing-function: steps(34, end); }
      73.000%, 100% { transform: translateX(0); } }
    @keyframes show-2 { 0%, 50.000% { opacity: 0; } 50.050%, 73.000% { opacity: 1; } 73.050%, 100% { opacity: 0; } }
    .clip-2 { transform-box: fill-box; transform-origin: left; animation: reveal-2 20s infinite; }
    .caret-2 { animation: caret-2 20s infinite, show-2 20s infinite; }
    @keyframes reveal-3 {
      0%, 75.000% { transform: scaleX(0); animation-timing-function: steps(31, end); }
      82.750%, 94.000% { transform: scaleX(1); animation-timing-function: steps(31, end); }
      98.000%, 100% { transform: scaleX(0); } }
    @keyframes caret-3 {
      0%, 75.000% { transform: translateX(0); animation-timing-function: steps(31, end); }
      82.750%, 94.000% { transform: translateX(390.6px); animation-timing-function: steps(31, end); }
      98.000%, 100% { transform: translateX(0); } }
    @keyframes show-3 { 0%, 75.000% { opacity: 0; } 75.050%, 98.000% { opacity: 1; } 98.050%, 100% { opacity: 0; } }
    .clip-3 { transform-box: fill-box; transform-origin: left; animation: reveal-3 20s infinite; }
    .caret-3 { animation: caret-3 20s infinite, show-3 20s infinite; }
    
    .skin { fill: #e3b08a; } .skin-dark { stroke: #c08a63; } .hair { fill: #2b2e38; } .hair-line { stroke: #2b2e38; }
    .shirt { fill: #3a4354; } .shirt-line { stroke: #3a4354; } .collar { fill: #2d3544; } .lid { fill: #1c2230; } .cup { fill: #c9d1d9; }
    @media (prefers-color-scheme: light) { .hair { fill: #17181c; } .hair-line { stroke: #17181c; } .shirt { fill: #2f3744; } .shirt-line { stroke: #2f3744; } .collar { fill: #222933; } .lid { fill: #2b3340; } .cup { fill: #8c959f; } }
    .float-a { animation: float 6s ease-in-out infinite; }
    .float-b { animation: float 7s ease-in-out -2s infinite; }
    .type { transform-box: fill-box; transform-origin: left; animation: type 10s cubic-bezier(0.22, 1, 0.36, 1) infinite backwards; }
    .build { stroke-dasharray: 1; animation: build 10s ease-in-out infinite backwards; }
    .pupil { animation: glance 10s ease-in-out infinite; }
    .lids { transform-box: fill-box; transform-origin: center; animation: blink 4.6s ease-in-out infinite; }
    .head { transform-box: fill-box; transform-origin: 50% 100%; animation: tilt 10s ease-in-out infinite; }
    .arm-l { transform-box: fill-box; transform-origin: 100% 0%; animation: tap 0.4s ease-in-out infinite alternate; }
    .arm-r { transform-box: fill-box; transform-origin: 0% 0%; animation: tap-r 0.4s ease-in-out 0.2s infinite alternate; }
    .logo { animation: logo 3s ease-in-out infinite; }
    .steam { stroke-dasharray: 3 5; animation: steam 2.4s linear infinite; }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
    @keyframes type { 0% { transform: scaleX(0); } 5%, 84% { transform: scaleX(1); } 92%, 100% { transform: scaleX(0); } }
    @keyframes build { 0% { stroke-dashoffset: 1; } 10%, 84% { stroke-dashoffset: 0; } 92%, 100% { stroke-dashoffset: 1; } }
    @keyframes glance { 0%, 8% { transform: translateX(0); } 14%, 44% { transform: translateX(-3px); } 52%, 86% { transform: translateX(3px); } 94%, 100% { transform: translateX(0); } }
    @keyframes blink { 0%, 44%, 50%, 100% { transform: scaleY(1); } 47% { transform: scaleY(0.1); } }
    @keyframes tilt { 0%, 8%, 94%, 100% { transform: rotate(0deg); } 14%, 44% { transform: rotate(-2deg); } 52%, 86% { transform: rotate(2deg); } }
    @keyframes tap { from { transform: rotate(0deg); } to { transform: rotate(2.4deg); } }
    @keyframes tap-r { from { transform: rotate(0deg); } to { transform: rotate(-2.4deg); } }
    @keyframes logo { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes steam { to { stroke-dashoffset: -16; } }
    @media (prefers-reduced-motion: reduce) {
      .rise, .beat, .caret, [class^="clip-"], .float-a, .float-b, .type, .build, .pupil, .lids, .head, .arm-l, .arm-r, .logo, .steam { animation: none !important; }
      .build { stroke-dashoffset: 0; }
      .caret { opacity: 0; }
      .typed:not(.typed-first) { display: none; }
    }
  </style>
  <defs>
    <!-- The name's fill: text colour with a band of colour that sweeps across (a colour change, not movement). -->
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="-400" y1="0" x2="0" y2="0">
      <stop offset="0" class="stop-fg"/><stop offset="0.5" class="stop-accent"/><stop offset="1" class="stop-fg"/>
      <animate attributeName="x1" values="-400;1200" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0;1600" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <g class="rise" style="animation-delay: 0.05s">
    <circle class="beat" cx="10" cy="72" r="5" fill="#34d399"/>
    <circle cx="10" cy="72" r="5" fill="#34d399"/>
    <text class="muted" x="26" y="77" font-size="14" font-weight="500">Open to full-stack roles</text>
  </g>
  <text class="rise" style="animation-delay: 0.15s" x="2" y="176" font-size="70" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Montaser Ismail</text>
  <text class="rise muted" style="animation-delay: 0.25s" x="4" y="222" font-size="23" font-weight="500">Software Engineer · Egypt</text>
  <g class="rise" style="animation-delay: 0.35s">
    <text class="mono fg" x="4" y="300" font-size="21">I build</text>
    <clipPath id="clip-0"><rect class="clip-0" x="104.8" y="279" width="516.6" height="31.5"/></clipPath>
  <text class="mono accent typed typed-first" clip-path="url(#clip-0)" x="104.8" y="300" font-size="21" textLength="516.6" lengthAdjust="spacing">software for how businesses actually run.</text>
  <rect class="caret caret-0 accent" x="106.8" y="282.15" width="2.5" height="23.1"/>
  <clipPath id="clip-1"><rect class="clip-1" x="104.8" y="279" width="415.8" height="31.5"/></clipPath>
  <text class="mono accent typed" clip-path="url(#clip-1)" x="104.8" y="300" font-size="21" textLength="415.8" lengthAdjust="spacing">metadata-driven React interfaces.</text>
  <rect class="caret caret-1 accent" x="106.8" y="282.15" width="2.5" height="23.1"/>
  <clipPath id="clip-2"><rect class="clip-2" x="104.8" y="279" width="428.4" height="31.5"/></clipPath>
  <text class="mono accent typed" clip-path="url(#clip-2)" x="104.8" y="300" font-size="21" textLength="428.4" lengthAdjust="spacing">real-time Node.js and NestJS APIs.</text>
  <rect class="caret caret-2 accent" x="106.8" y="282.15" width="2.5" height="23.1"/>
  <clipPath id="clip-3"><rect class="clip-3" x="104.8" y="279" width="390.6" height="31.5"/></clipPath>
  <text class="mono accent typed" clip-path="url(#clip-3)" x="104.8" y="300" font-size="21" textLength="390.6" lengthAdjust="spacing">systems backed by 1,200+ tests.</text>
  <rect class="caret caret-3 accent" x="106.8" y="282.15" width="2.5" height="23.1"/>
  </g>
